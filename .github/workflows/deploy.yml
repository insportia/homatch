name: Deploy Homatch

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: ptxajsjhobhvsfhmutjn

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Lint
        env:
          VITE_SUPABASE_URL: https://ptxajsjhobhvsfhmutjn.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run lint
      - name: Build frontend
        env:
          VITE_SUPABASE_URL: https://ptxajsjhobhvsfhmutjn.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run build

  migrate:
    name: Verify DB Migration History
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Sync and apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for version in \
            20260827203146 \
            20260827205525 \
            20260827212117 \
            20260827213737 \
            20260827221926 \
            20260828071514; do
            supabase migration repair "$version" --status applied --project-ref "$SUPABASE_PROJECT_REF" 2>&1 || true
          done
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy JWT functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FUNCTIONS=(
            atomic-unlock
            credits-topup
            import-property
            seed-demo-matches
            provider-health-check
            generate-search-profile
            apify-discover
          )
          for fn in "${FUNCTIONS[@]}"; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
      - name: Deploy internal/public functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FUNCTIONS=(
            classify-signals
            classify-signals-v2
            dataforseo-search
            payment-webhook
            run-matching
            run-matching-v2
            social-collect
            spend-cap-check
          )
          for fn in "${FUNCTIONS[@]}"; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate, migrate, deploy-functions]
    if: always()
    steps:
      - name: Report
        run: |
          echo "## Homatch Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Validate/build: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- DB migrations: ${{ needs.migrate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Edge functions: ${{ needs.deploy-functions.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend production deploy: handled by Vercel native GitHub integration" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.validate.result }}" == "failure" ]] || [[ "${{ needs.migrate.result }}" == "failure" ]] || [[ "${{ needs.deploy-functions.result }}" == "failure" ]]; then
            exit 1
          fi
