name: Deploy Homatch

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: >-
          Run `supabase db push` against production. The historical drift is
          handled by the ledger repair in the migrate job, which aligns every
          migration up to the BASELINE before pushing anything new.
        type: boolean
        default: false
      redeploy:
        description: >-
          Redeploy from current main even if nothing changed. `edge` for every
          edge function, a single function name such as `ai-talk-session`, or
          blank for the normal change-detected path. This exists so that
          "production is behind" is never answered by pushing a no-op commit:
          that is a lie in the history and it triggers every other component too.
        type: string
        default: ''

# ONE DEPLOYMENT AT A TIME, AND NONE OF THEM THROWN AWAY.
#
# This was `cancel-in-progress: true`, and on 2026-09-19 it cost a P0. A
# Georgian speaker was being answered in Hindi; dafdebd2 fixed it, reached
# main, and its run was cancelled by two commits from parallel sessions that
# landed during the fifteen minutes this workflow spends deploying every edge
# function in the repository one at a time. `ai-talk-session` is late in that
# sequence, so it is the most likely thing to be cut. Production kept the old
# resolver for hours while main and the frontend had the fix, and the owner
# tested the half-deployed result and reported the bug as still present.
#
# Cancelling made sense when every run did the same fifteen minutes of work:
# superseding it was the only way to converge. It does not make sense now that
# a run deploys only what is actually owed -- usually one function, usually
# under two minutes -- so runs QUEUE instead. A superseded run still starts,
# finds its components already current, and exits in seconds.
#
# The safety net underneath is scripts/deploy-scope.mjs: scope is the diff from
# refs/deployed/<component> to HEAD, and that ref only advances after a
# successful deploy. Even if a run dies, the work stays owed.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ptxajsjhobhvsfhmutjn

jobs:
  # ── Job 0: What does production actually need? ─────────────────────────────
  #
  # Answered against refs/deployed/<component>, never against HEAD~1. The
  # difference is the whole incident: at a2f2a91b the previous commit touched
  # no edge function, so a HEAD~1 reading queued nothing and the language fix
  # two commits back stayed unshipped.
  scope:
    name: Deployment scope
    runs-on: ubuntu-latest
    outputs:
      edge: ${{ steps.scope.outputs.edge }}
      functions: ${{ steps.scope.outputs.functions }}
      frontend: ${{ steps.scope.outputs.frontend }}
      worker: ${{ steps.scope.outputs.worker }}
    steps:
      # Full history: a diff against a ref several commits back is the point.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch deployment refs
        run: git fetch origin '+refs/deployed/*:refs/deployed/*' || echo "no deployment refs yet — first run"

      - name: Compute scope
        id: scope
        run: |
          REDEPLOY='${{ github.event.inputs.redeploy }}'
          if [[ -n "$REDEPLOY" ]]; then
            echo "Manual redeploy requested: $REDEPLOY"
            if [[ "$REDEPLOY" == "edge" ]]; then
              FNS=$(node -e "import('./scripts/deploy-scope.mjs').then(m=>console.log(m.edgeFunctionNames().join(' ')))")
            else
              FNS="$REDEPLOY"
            fi
            echo "edge=true" >> $GITHUB_OUTPUT
            echo "functions=$FNS" >> $GITHUB_OUTPUT
            echo "frontend=false" >> $GITHUB_OUTPUT
            echo "worker=false" >> $GITHUB_OUTPUT
          else
            node scripts/deploy-scope.mjs
            SCOPE=$(node scripts/deploy-scope.mjs --json)
            echo "edge=$(echo "$SCOPE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).components.edge.deploy))")" >> $GITHUB_OUTPUT
            echo "functions=$(echo "$SCOPE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).functions.join(' ')))")" >> $GITHUB_OUTPUT
            echo "frontend=$(echo "$SCOPE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).components.frontend.deploy))")" >> $GITHUB_OUTPUT
            echo "worker=$(echo "$SCOPE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).components.worker.deploy))")" >> $GITHUB_OUTPUT
          fi

      - name: Report
        run: |
          node scripts/deploy-scope.mjs >> $GITHUB_STEP_SUMMARY || true

  # ── Job 1: Validate ────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20. The frontend suite imports the .ts domain modules
          # directly, which needs Node's native type stripping (on by default
          # from 22.18 / 24). On Node 20 every such test dies with
          # ERR_UNKNOWN_FILE_EXTENSION, so the gate could not run at all.
          # This also matches the Node developers run locally, which is what
          # let a 413-test suite pass on a laptop and fail in CI.
          node-version: 24
          cache: pnpm

      - name: Install ast-grep
        run: |
          npm install -g @ast-grep/cli
          ast-grep --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc --noEmit` on the ROOT tsconfig checks NOTHING: it has "files": []
      # and only project references, so the command exits 0 without compiling a
      # single file. It was a green gate that could not fail. tsconfig.check.json
      # is the config the lint script's tsgo already uses; running real tsc
      # against it gives a genuine second type-check with a different engine.
      - name: Type-check
        run: pnpm exec tsc -p tsconfig.check.json --noEmit

      - name: Lint
        env:
          VITE_SUPABASE_URL: https://ptxajsjhobhvsfhmutjn.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run lint

      # The regression suite gates the DEPLOY, not just the PR.
      #
      # Every job below depends on `validate`, so a broken Verify invariant
      # now stops the release instead of shipping and being discovered in
      # production. It needs no credentials, calls no paid provider and does
      # not touch production: the Verify suites are pure, and the research
      # pipeline is exercised through fixtures.
      - name: Tests
        run: pnpm test

      # Built from .env.harness, which holds a stub origin and a fake anon
      # key rather than a credential. The mobile test intercepts every
      # request the page makes, so this reaches no network and no backend.
      - name: Build mobile harness
        run: pnpm run build:harness

      # Real Chrome at 320/360/375/390/430 with the Evidence drawer
      # expanded. CI=true turns a missing browser or driver into a FAILURE
      # rather than a skip, so this gate cannot report green without having
      # actually run.
      - name: Mobile regression (real viewports)
        run: pnpm run test:mobile
      # The same real Chrome, driving Site Studio: click a section, edit the
      # text in place, paste markup at it, add/duplicate/move/hide/delete a
      # block. Four defects that passed type-check, lint and every unit test
      # were found only by doing this, so it runs on every change.
      - name: Site Studio regression (real browser)
        run: pnpm run test:studio

      # The service worker, in the same real Chrome. What a push BECOMES and
      # where a tap goes were the only parts of web push that had never run
      # anywhere: the server half is verified against production, and this is
      # the half that decides whether a notification is blank, stacks twelve
      # deep, or opens somebody else's site.
      - name: Web push handlers (real service worker)
        run: pnpm run test:push

      # Keyboard use, accessible names, visible focus and 320px on the pages
      # this pass touched — none of which the contrast and overflow gates can
      # see — plus the two performance questions it could have got wrong: what
      # a visitor downloads, and whether a search over 4,773 strings can be
      # typed into.
      - name: Accessibility and performance audit
        run: pnpm run test:a11y

      # The edge functions are Deno TypeScript with URL and jsr: imports, so
      # they sit outside the tsconfig and nothing else parses them. A
      # research-agent/index.ts that could not be parsed AT ALL once passed
      # type-check, lint, 796 tests and the mobile gate — and was caught only
      # by the deploy step below, after the commit was already on main.
      - name: Edge function syntax
        run: pnpm run check:edge

  # ── Job 2: Build frontend (pnpm build — no Vercel CLI required) ───────────
  # Vercel's native GitHub integration handles production deploys automatically.
  # This job only verifies the build compiles cleanly.
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: validate
    env:
      VITE_SUPABASE_URL: https://ptxajsjhobhvsfhmutjn.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20. The frontend suite imports the .ts domain modules
          # directly, which needs Node's native type stripping (on by default
          # from 22.18 / 24). On Node 20 every such test dies with
          # ERR_UNKNOWN_FILE_EXTENSION, so the gate could not run at all.
          # This also matches the Node developers run locally, which is what
          # let a 413-test suite pass on a laptop and fail in CI.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  # ── Job 3: Deploy Supabase migrations ─────────────────────────────────────
  #
  # STILL GATED BEHIND workflow_dispatch, deliberately. Schema changes should
  # be an intentional act, not a side effect of merging.
  #
  # WHAT WAS WRONG, AND WHAT WAS ACTUALLY MEASURED
  #
  # The repair loop below used to name 21 versions. All 21 were already in
  # the production ledger, so it repaired nothing. `supabase db push` then
  # replayed every repository migration the ledger did not know about — 74 of
  # them on 2026-09-18, every one already applied to production. That replay
  # would have run 131 INSERTs, 127 DROP POLICYs, 75 UPDATEs, 17 DROP
  # TRIGGERs and a top-level DELETE against cost_events, plus errored on the
  # two migrations that still had unguarded CREATE TABLE/TYPE/INDEX.
  #
  # Production predates repository-backed migration tracking. Those 74 were
  # applied through the dashboard, which recorded them under ITS OWN version
  # numbers, so the ledger already held 70 of them by name under a different
  # version. Before the baseline was set, every one was verified effect by
  # effect against the live catalogue — 668 checks covering 76 tables, 153
  # indexes, 101 columns, 162 policies, 109 functions, 20 constraints, 14
  # triggers, 8 views and 3 types — not merely "the table exists".
  #
  # So the repair walks the migrations directory and aligns the ledger for
  # everything at or below MIGRATION_BASELINE. That is a LEDGER-ONLY
  # operation: it writes no schema and touches no data. `db push` afterwards
  # pushes only migrations newer than the baseline, which are the only ones
  # that have genuinely never run.
  #
  # ON THE TWO MIGRATIONS THAT CANNOT BE REPLAYED
  #
  # research_case_persistence is now idempotent: guards only, no product
  # behaviour changed, and proven on a rebuilt-from-empty copy of its own
  # objects to produce byte-identical columns, indexes, constraints and
  # triggers.
  #
  # mortgage_feature_v1 is deliberately NOT guarded. Its seed INSERTs carry
  # the National Bank PTI and LTV rules and have no natural key, so a replay
  # would duplicate them. Its unguarded CREATE TYPE is therefore load-bearing:
  # it makes a replay fail on the first statement, inside a transaction,
  # before anything can be written. Guarding the DDL alone would only let the
  # replay get further before failing; guarding the policies too would let it
  # reach the seeds and silently double the rule set. The ledger baseline,
  # not idempotency, is what keeps it from ever running twice.
  #
  # MOVING THE BASELINE IS A DELIBERATE EDIT. Raising it marks migrations as
  # applied without running them; only do that for migrations independently
  # verified to be present in production already.
  migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations }}
    steps:
      - uses: actions/checkout@v4

      # PINNED, and the lookup is authenticated.
      #
      # `version: latest` makes this action resolve the newest CLI release
      # through the GitHub API, and on a shared runner that call is
      # unauthenticated and rate limited -- which is why this step failed in
      # CI while the identical deploy succeeded from a laptop. The action's
      # own `github-token` input exists for exactly that reason.
      #
      # Pinned as well, because "whatever shipped this morning" is not a
      # deployment tool: 2.117.0 is the version these functions were actually
      # deployed with by hand. Moving it is a deliberate edit and a re-test.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The repository's own history must be coherent before anything is
      # pushed at it. This needs no credentials and reads no database: it is
      # the same audit the test suite runs, repeated here because the moment
      # just before `db push` is the last one where a drifted history can
      # still be stopped cheaply.
      - name: Audit migration history
        run: node scripts/migration-baseline.mjs

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          # THE BASELINE IS READ, NOT RETYPED.
          #
          # This step used to carry its own hard-coded MIGRATION_BASELINE,
          # a second copy of a fact that also lives in the reconciliation
          # artefact — and it had already fallen behind it, which would have
          # left the four reconciled storage migrations out of the alignment
          # loop. One source, read at run time, cannot drift from itself.
          MIGRATION_BASELINE="$(jq -r .baselineThrough supabase/migration-baseline.json)"
          if [[ -z "$MIGRATION_BASELINE" || "$MIGRATION_BASELINE" == "null" ]]; then
            echo "::error::supabase/migration-baseline.json has no baselineThrough"
            exit 1
          fi

          echo "Aligning the migration ledger up to baseline $MIGRATION_BASELINE..."
          echo "(ledger-only: this writes no schema and touches no data)"

          aligned=0
          for path in supabase/migrations/*.sql; do
            version="$(basename "$path" | cut -d_ -f1)"
            # Lexicographic compare is correct here: every version is a
            # zero-padded numeric string of the same generation scheme.
            if [[ "$version" > "$MIGRATION_BASELINE" ]]; then continue; fi
            supabase migration repair "$version" \
              --status applied \
              --project-ref "$SUPABASE_PROJECT_REF" \
              >/dev/null 2>&1 || true
            aligned=$((aligned + 1))
          done
          echo "  ✅ Aligned $aligned migration(s) at or below the baseline"

          echo "Pushing migrations newer than the baseline..."
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}" \
            2>&1
          echo "✅ Migrations applied"

  # ── Job 4: Deploy Edge Functions ──────────────────────────────────────────
  # Depends on validate, NOT on migrate. Edge Function deployment must never be
  # gated behind a migration job that is knowingly disabled -- that is what
  # previously stopped new functions from ever reaching production from source.
  #
  # THE JOB DOES NOT ASK ANOTHER JOB WHETHER IT SHOULD RUN.
  #
  # It used to: `if: needs.scope.outputs.edge == 'true'`, with `needs: [scope]`
  # to carry the answer. On 2026-09-19 that boundary failed twice in four
  # hours, in both directions, and each failure was silent.
  #
  #   8618f244  edge='true' arrived, functions='' arrived. The loop matched
  #             nothing, uploaded nothing, exited 0, and the run was green.
  #   d810e3ec  edge did not arrive as 'true' at all, so the job was SKIPPED
  #             outright -- while the identical script, run against the
  #             identical base, named five owed functions on a laptop.
  #
  # Both times refs/deployed/edge then advanced past work that had never been
  # uploaded, which erased the evidence: the next run diffed from the false
  # ref, saw nothing owed, and the fix disappeared. ai-talk-session sat on its
  # 17:22:55 build for hours with three green deployments on top of it.
  #
  # Every guard written to catch this was itself gated on the same output, so
  # when the output was wrong none of them could fire. That is the real
  # defect: not the value, but that one unreliable string decided both the
  # work and the checking of the work.
  #
  # So the job always starts, computes its own scope from the last VERIFIED
  # deployed-edge base in its own checkout, and reports NO_WORK about itself
  # when nothing is owed. A skipped job and an honest empty one are no longer
  # the same observation from the outside.
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE PROOF NEEDS THE ESZIP PARSER, SO THIS JOB NEEDS node_modules.
      #
      # It never did before: every script it ran was dependency-free, so the
      # job checked out and went straight to the CLI. "Prove it in production"
      # now reads the deployed artifact, which means parsing an eszip, which
      # means @deno/eszip -- and without an install that import fails, every
      # function reports UNAVAILABLE, and the whole mechanism is inert while
      # looking like a principled refusal.
      #
      # Same pnpm and same lockfile as Validate, so the parser is pinned by
      # the repository rather than resolved fresh at deploy time.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch deployment refs
        run: git fetch origin '+refs/deployed/*:refs/deployed/*' || echo "no deployment refs yet - first run"

      # PINNED, and the lookup is authenticated.
      #
      # `version: latest` makes this action resolve the newest CLI release
      # through the GitHub API, and on a shared runner that call is
      # unauthenticated and rate limited -- which is why this step failed in
      # CI while the identical deploy succeeded from a laptop. The action's
      # own `github-token` input exists for exactly that reason.
      #
      # Pinned as well, because "whatever shipped this morning" is not a
      # deployment tool: 2.117.0 is the version these functions were actually
      # deployed with by hand. Moving it is a deliberate edit and a re-test.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ONE SOURCE OF TRUTH, READ WHERE THE WORK HAPPENS.
      #
      # Written to a file rather than a job output on purpose. The file is
      # what the deploy loops read AND what the verification reads back, so
      # the list that decides what is uploaded and the list that decides what
      # must be proven are the same bytes, with no serialisation between them.
      - name: What is owed
        id: owed
        run: |
          set -euo pipefail
          REDEPLOY='${{ github.event.inputs.redeploy }}'
          if [[ -n "$REDEPLOY" ]]; then
            echo "manual redeploy: $REDEPLOY"
            if [[ "$REDEPLOY" == "edge" ]]; then
              LIST=$(node -e "import('./scripts/deploy-scope.mjs').then(m=>console.log(m.edgeFunctionNames().join(' ')))")
            else
              LIST="$REDEPLOY"
            fi
          else
            node scripts/deploy-scope.mjs >> $GITHUB_STEP_SUMMARY || true
            LIST=$(node scripts/deploy-scope.mjs --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).functions.join(' ')))")
          fi
          COUNT=$(echo $LIST | wc -w)
          echo "$LIST" > "$RUNNER_TEMP/owed.txt"
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "owed ($COUNT): [$LIST]"
          if (( COUNT == 0 )); then
            # SELF-REPORTED, NOT INFERRED FROM AN ABSENCE. A run with nothing
            # to do says so in its own summary. A run that was prevented from
            # starting cannot say anything at all, and the two must never
            # again be indistinguishable to whoever reads the result.
            echo "### Edge Functions: NO_WORK" >> $GITHUB_STEP_SUMMARY
            echo "Nothing is owed between refs/deployed/edge and ${{ github.sha }}." >> $GITHUB_STEP_SUMMARY
          fi

      # The reading production gives BEFORE anything is uploaded. Every later
      # claim of success is measured against this file and nothing else.
      - name: Production, before
        if: steps.owed.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "$(date -u +%s)000" > "$RUNNER_TEMP/started-at-ms"
          node scripts/edgeArtifacts.mjs snapshot $(cat "$RUNNER_TEMP/owed.txt") > "$RUNNER_TEMP/pre.json"
          cat "$RUNNER_TEMP/pre.json"

      - name: Deploy functions — JWT required
        if: steps.owed.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          JWT_FUNCTIONS=(
            # HOMATCH FOR DEVELOPERS. Both are browser-facing and keep the
            # gateway JWT check on: the anon key is a valid JWT, so the check
            # costs nothing and keeps them off the open internet. The real
            # credential in each case is a share token, checked in SQL.
            #
            #   developer-buyer-document  signs one document a buyer was
            #                             given. The database decides whether
            #                             the token and the document belong
            #                             together; this only mints the URL.
            #   developer-floorplan-extract  reads a floor plan and writes
            #                             what it saw onto dt_floorplans as a
            #                             PROPOSAL. It generates no geometry and
            #                             publishes no scene; a person verifies
            #                             the reading before any of that happens.
            #   developer-document-extract  reads a contract or receipt and
            #                             writes the reading onto the document
            #                             and nowhere else. It never touches
            #                             dev_deals or dev_payments.
            "developer-buyer-document"
            "developer-document-extract"
            "developer-floorplan-extract"
            # Object storage. storage-sign is the ONLY runtime anywhere that
            # holds an R2 credential: it authorises the caller in Postgres
            # under that caller's own token and hands back a short-lived
            # presigned URL, so gateway JWT verification is required and the
            # real decision happens inside the function. storage-selftest
            # proves the bucket end to end and is gated by a single-use
            # ticket row rather than by an account.
            "storage-sign"
            "storage-selftest"
            # The migration copier and the bucket inventory. Both are
            # ticket-gated proof tools rather than product endpoints, and
            # both are registered here so a repository fix to them actually
            # reaches production.
            "storage-migrate"
            "storage-inventory"
            "atomic-unlock"
            "credits-topup"
            # Stores a reusable payment method and grants the one-time
            # activation bonus. Browser-facing and JWT-verified: it acts on
            # the signed-in customer and on nobody else, and the bonus it
            # can trigger is granted by a service-role RPC that refuses
            # every other caller.
            "payment-method-setup"
            "import-property"
            "match-campaign"
            "provider-health-check"
            "external-discovery-orchestrator"
            # Recovery release. All three authenticate the caller themselves
            # and then read through that caller's own RLS, so JWT verification
            # is required, not optional. They import shared domain modules from
            # src/ by relative path; the CLI bundles that closure, which was
            # confirmed against production on verification-handoff.
            "verify-synthesis"
            "deal-room-ai"
            "verification-handoff"
            "deal-room-document-analyze"
            # Outreach. These four were deployed by hand and never registered
            # here, so repository fixes to them could not reach production --
            # the duplicate-send race in outreach-send lived in a file CI never
            # shipped. All four require the caller's JWT (they resolve the
            # caller's profile and check ownership before doing anything), and
            # the production functions are already verify_jwt=true, so this
            # changes how they are deployed, not how they are protected.
            "outreach-send"
            "contact-import"
            "social-post-generate"
            "community-recommend"
            # The fifth, found the same way and worse.
            #
            # outreach-campaign-preview writes owner_id, and the version live
            # in production writes public.users.id into a column whose foreign
            # key points at auth.users(id). Zero of the ten profile ids in this
            # database satisfy that key, so creating a campaign fails with
            # 23503 for EVERY user and always has -- which is why there is not
            # one outreach campaign in production.
            #
            # The repository has written `user.id` for some time. It could
            # never reach production, because this list is how anything gets
            # there and this function was not on it. deployCoverage printed it
            # as hand-deployed on every run, in a warning whose own text says a
            # repository change to it does not reach production.
            "outreach-campaign-preview"
            # The assistant, and the anonymous session it needs.
            #
            # homatch-ai has been production since day one and was NEVER listed
            # here: every version was deployed by hand, so repository changes to
            # it could not reach customers. anon-session is new. Both take the
            # caller's JWT -- the anon key is a valid one, which is exactly how
            # a visitor without an account reaches them, and the function itself
            # then decides what that caller is allowed to see.
            "homatch-ai"
            "anon-session"
            # developer-score has never been deployed at all, which is what made
            # /developer/:id a dead route.
            "developer-score"
            # Billing v2. `billing` is new. The other two were NEVER in either
            # list, so every repository change to the Verify orchestrator and
            # to AI Chat since this workflow was written has been unable to
            # reach production -- including the entitlement wiring that decides
            # whether a run is funded. Both authenticate the caller themselves
            # and then act under the service role, so JWT verification is
            # required, exactly as it already is in production.
            # push-send signs VAPID and reads every push subscription, so it
            # runs under the service role and authenticates the caller itself.
            # The test action can only ever reach the callers own devices.
            "push-send"
            "billing"
            "homatch-research"
            # HOMATCH INVESTMENT INTELLIGENCE. Both are browser-facing and
            # keep the gateway JWT check on: each resolves the caller's own
            # profile and then reads through that caller's RLS, so a valid JWT
            # is a precondition rather than an optimisation.
            #
            #   investment-consultant  orchestrates one consultation turn.
            #                          It imports the deterministic engine from
            #                          src/investment by relative path and does
            #                          the arithmetic itself; the model only
            #                          extracts fields and explains the result.
            #                          Free, with a per-user daily fair-use
            #                          ceiling on rate_limit_events.
            #   investment-research    runs the Research Core's comparable lane
            #                          against the portal allowlist. No paid
            #                          provider, so no reservation and no COGS
            #                          row — bounded by the same table.
            #
            # Both pull src/ modules into the bundle, the way verify-synthesis
            # and deal-room-ai already do; the CLI resolves that closure.
            "investment-consultant"
            "investment-research"
            # Communications. Each of these calls authenticate(req) or
            # requireAdmin(req) and then acts under the service role, so the
            # gateway's JWT check is the correct outer gate.
            #
            # ai-talk-session is in THIS list even though the homepage demo is
            # anonymous: the publishable anon key is a valid JWT, so the
            # gateway passes and the function does its own identity work
            # against anonymous_sessions. Moving it to the no-JWT list would
            # remove a check and buy nothing.
            "comm-agent"
            "comm-campaign-launch"
            "comm-provider-status"
            "whatsapp-send"
            "whatsapp-sync"
            "cartesia-access-token"
            "ai-talk-session"
            "voice-ai"
            # ── The notification producers CI could not ship ──────────────
            #
            # All three were deployed by hand in August and never registered,
            # so every repository change to them since has stayed in the
            # repository. That stopped mattering quietly and then stopped
            # being quiet: notify_emit — dedupe, aggregation, preferences,
            # quiet hours and push — went live with twelve producers wired to
            # it, and these three kept writing rows directly in production
            # because production was still running August's code.
            #
            # A direct message, a viewing request and a finished research
            # purchase are three of the four things Homatch most needs to
            # tell somebody about.
            #
            # All three authenticate the caller themselves and then act under
            # the service role, and all three are verify_jwt=true in
            # production today, so this changes how they are deployed and not
            # how they are protected.
            "send-message"
            "viewing-request"
            "research-purchase"
          )
          # ONLY WHAT IS OWED, AND IN PARALLEL.
          #
          # This walked all forty-one of these serially on every push, whether
          # or not a single one had changed -- roughly fifteen minutes of
          # uploads for a one-line fix, and fifteen minutes in which any other
          # push cancelled the lot. `OWED` comes from the scope job, which
          # diffs against what is actually deployed rather than against the
          # last commit.
          #
          # Eight at a time: the work is upload-bound rather than CPU-bound,
          # and a failure still names the function that failed because each
          # writes its own marker file.
          # The same bytes the verification step reads back.
          OWED_LIST=$(cat "$RUNNER_TEMP/owed.txt")
          if [[ -z "${OWED_LIST// /}" ]]; then
            echo "::error::this step only runs when functions are owed, and the owed list is empty"
            exit 1
          fi
          read -ra OWED <<< "$OWED_LIST"
          declare -A WANTED=()
          for fn in "${OWED[@]}"; do [[ -n "$fn" ]] && WANTED["$fn"]=1; done

          FAILED=()
          MATCHED=0
          TMP=$(mktemp -d)
          RUNNING=0
          for fn in "${JWT_FUNCTIONS[@]}"; do
            [[ -z "${WANTED[$fn]:-}" ]] && continue
            MATCHED=$((MATCHED + 1))
            (
              if supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" 2>&1; then
                echo "  ✅ $fn"
              else
                echo "  ❌ $fn FAILED"; touch "$TMP/$fn.failed"
              fi
            ) &
            RUNNING=$((RUNNING + 1))
            # TWO, NOT EIGHT.
            #
            # Each deploy bundles inside its own container, so eight at once
            # is eight simultaneous anonymous pulls of the same image from
            # AWS ECR Public, which rate-limits per source IP -- and a shared
            # runner is one IP. Six "toomanyrequests" in run 36098574958,
            # three in 36099775881, ZERO in 36104657682 at this setting.
            #
            # A warm-up pull used to sit before these loops to make the first
            # fetch serial. It is gone: it self-skipped every run, because the
            # image reference is not one string in the CLI binary -- the
            # registry "public.ecr.aws/supabase/" and the tag
            # "supabase/edge-runtime:v1.74.3" are stored apart -- and the
            # measurement above says the bound is doing the work by itself.
            # Scraping a 95 MB binary for a tag that belongs to the CLI and
            # not to this repository is not a mechanism worth depending on.
            if (( RUNNING >= 2 )); then wait -n || true; RUNNING=$((RUNNING - 1)); fi
          done
          wait
          for f in "$TMP"/*.failed; do
            [[ -e "$f" ]] || continue
            FAILED+=("$(basename "$f" .failed)")
          done
          echo "$MATCHED" > "$RUNNER_TEMP/matched-jwt"
          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "::error::Failed to deploy: ${FAILED[*]}"
            exit 1
          fi

      - name: Deploy functions — no JWT verification
        if: steps.owed.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          NO_JWT_FUNCTIONS=(
            "classify-signals"
            # ── THE RETIRED PROVIDERS' FUNCTIONS, WHICH HAVE TO BE SHIPPED ──
            #
            # All four answer 423 and reach no provider. They were previously
            # excused from CI as "hand-deployed; CI route unreviewed", which
            # had a consequence nobody had had to face until now: a change to
            # them CANNOT REACH PRODUCTION. Retiring apify-discover in the
            # repository while production kept running the live Apify code is
            # exactly the gap the accounting check caught on run 724.
            #
            # No JWT, because a 423 stub authenticates nobody and there is
            # nothing behind it to protect. dataforseo-search has been in this
            # list on those terms since it was retired.
            "dataforseo-search"
            "apify-discover"
            "source-discovery-massive"
            "source-monitor-public"
            # The signal classifier. Called by the worker tick with the
            # service key, never by a browser -- the same shape as
            # classify-signals directly above it, which has always been here.
            # It was excused for no reason anybody recorded, and the retry
            # fix for the 510 permanent ERRORs is worthless in a repository
            # that production never sees.
            "classify-signals-v2"
            "payment-webhook"
            "run-matching"
            "social-collect"
            "spend-cap-check"
            "discovery-queue-worker"
            "continuous-matching-worker"
            "run-matching-v2"
            # The Verify orchestrator. It belongs in THIS list, not the JWT one:
            # it authenticates the caller itself (rejects a missing or invalid
            # Authorization header with its own JSON 401) precisely so a failure
            # returns a readable body instead of the gateway's headerless 500,
            # which is what surfaced to customers as "blocked by CORS policy".
            # Production has run verify_jwt=false since it was first deployed;
            # deploying it here with --no-verify-jwt preserves that exactly.
            "research-agent"
            # The durable-job tick. Same shape as the two workers above: it is
            # called by pg_cron, belongs to no customer, and so cannot present
            # a user JWT — it authenticates on the private jobs_worker_token in
            # admin_settings and answers anything else with 403. Registered
            # here from its first release rather than deployed by hand, which
            # is the mistake the comments above this line are all about.
            "jobs-worker"
            # The freshness worker. Same shape again: driven by pg_cron, owned
            # by no customer, authenticating on a private token in
            # admin_settings. It exists so that revalidation never happens
            # inside a customer's campaign or a page view -- a signal wanted by
            # forty campaigns is re-read once, here, on this tick.
            "revalidate-evidence"
            # ── Communications: the three that are NOT called by a browser ──
            #
            # These MUST be here rather than in the JWT list, and the
            # difference is not cosmetic. Meta and Vapi send no Authorization
            # header at all, so with the gateway check on, every one of their
            # requests is rejected with 401 before the function runs. That
            # failure is total and silent: Meta's subscription handshake (the
            # GET carrying hub.challenge) never succeeds, so the webhook
            # cannot even be registered; no inbound message, no delivery or
            # read receipt, and no call lifecycle event ever arrives. Calls
            # would never settle, costs would never be recorded and campaigns
            # would never complete, while every screen looked fine.
            #
            # Neither is unauthenticated. whatsapp-webhook verifies Meta's
            # X-Hub-Signature-256 HMAC against META_WHATSAPP_APP_SECRET and
            # answers the hub.verify_token challenge; voice-webhook compares
            # Vapi's shared secret in constant time and returns 401 without
            # it. comm-dispatch-worker is a pg_cron tick like jobs-worker and
            # answers anything that is not an internal caller with 403.
            "whatsapp-webhook"
            "voice-webhook"
            "comm-dispatch-worker"
            # Inbound email. The provider sends no Authorization header at
            # all — it signs the raw body with RESEND_WEBHOOK_SECRET under the
            # Svix scheme — so the gateway check would reject every genuine
            # delivery before the function ran, and the failure would be
            # total and silent: no reply ever reaching the inbox, with every
            # screen looking correct. The function verifies the signature
            # itself and answers 503 when the secret is unset.
            "email-webhook"
            # Saved searches. The fourth notification producer, and the only
            # one of the four that has NEVER been deployed at all — the
            # function exists in the repository, is called by the background
            # workers, and has answered nothing in production since it was
            # written. It belongs here rather than in the JWT list for the
            # same reason as the two workers above it: its callers are
            # background workers holding the service role, not browsers.
            "active-search-notify"
          )
          FAILED=()
          # The same bytes the verification step reads back.
          OWED_LIST=$(cat "$RUNNER_TEMP/owed.txt")
          if [[ -z "${OWED_LIST// /}" ]]; then
            echo "::error::this step only runs when functions are owed, and the owed list is empty"
            exit 1
          fi
          read -ra OWED <<< "$OWED_LIST"
          declare -A WANTED=()
          for fn in "${OWED[@]}"; do [[ -n "$fn" ]] && WANTED["$fn"]=1; done

          MATCHED=0
          TMP=$(mktemp -d)
          RUNNING=0
          for fn in "${NO_JWT_FUNCTIONS[@]}"; do
            [[ -z "${WANTED[$fn]:-}" ]] && continue
            MATCHED=$((MATCHED + 1))
            (
              if supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt 2>&1; then
                echo "  ✅ $fn"
              else
                echo "  ❌ $fn FAILED"; touch "$TMP/$fn.failed"
              fi
            ) &
            RUNNING=$((RUNNING + 1))
            # TWO, NOT EIGHT.
            #
            # Each deploy bundles inside its own container, so eight at once
            # is eight simultaneous anonymous pulls of the same image from
            # AWS ECR Public, which rate-limits per source IP -- and a shared
            # runner is one IP. Six "toomanyrequests" in run 36098574958,
            # three in 36099775881, ZERO in 36104657682 at this setting.
            #
            # A warm-up pull used to sit before these loops to make the first
            # fetch serial. It is gone: it self-skipped every run, because the
            # image reference is not one string in the CLI binary -- the
            # registry "public.ecr.aws/supabase/" and the tag
            # "supabase/edge-runtime:v1.74.3" are stored apart -- and the
            # measurement above says the bound is doing the work by itself.
            # Scraping a 95 MB binary for a tag that belongs to the CLI and
            # not to this repository is not a mechanism worth depending on.
            if (( RUNNING >= 2 )); then wait -n || true; RUNNING=$((RUNNING - 1)); fi
          done
          wait
          for f in "$TMP"/*.failed; do
            [[ -e "$f" ]] || continue
            FAILED+=("$(basename "$f" .failed)")
          done
          echo "$MATCHED" > "$RUNNER_TEMP/matched-nojwt"
          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "::error::Failed to deploy: ${FAILED[*]}"
            exit 1
          fi

      # ── C + D. The two questions a green loop cannot answer about itself ─
      #
      # `if: always()` because a verification that only runs when the thing it
      # verifies claims success is not a verification. This step decides
      # whether the deploy happened, so it must get to speak even when an
      # earlier step exited non-zero -- and above all when an earlier step
      # exited ZERO having done nothing, which is the failure that cost two
      # deployments and half a day.
      - name: Prove it in production
        if: always() && steps.owed.outputs.count != '0'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          OWED_COUNT=${{ steps.owed.outputs.count }}
          MATCHED=$(( $(cat "$RUNNER_TEMP/matched-jwt" 2>/dev/null || echo 0) + $(cat "$RUNNER_TEMP/matched-nojwt" 2>/dev/null || echo 0) ))
          echo "owed=$OWED_COUNT matched=$MATCHED"

          # C. Owed work and nothing uploaded is a HARD FAILURE. It used to be
          # a green job: both loops iterate hand-maintained name lists, so a
          # function that is owed but listed in neither is matched by neither
          # loop, deployed by nobody, and mourned by nothing.
          node --input-type=module -e "
            import { uploadAccounting } from './scripts/edgeArtifacts.mjs';
            const r = uploadAccounting($OWED_COUNT, $MATCHED);
            if (!r.ok) { console.log('::error::' + r.reason); process.exit(1); }
            console.log('accounting: every owed function reached a deploy command');
          "

          # D. Then what production is ACTUALLY RUNNING, per function, by name.
          # Unconditional and exhaustive: the old check asked about
          # ai-talk-session alone and only when a cross-job output told it to,
          # so run 8618f244 -- which uploaded comm-agent and silently dropped
          # ai-talk-session -- had nothing to fail against.
          #
          # ─────────────────────────────────────────────────────────────────
          # THIS ASKS ABOUT THE ARTIFACT, NOT THE VERSION COUNTER.
          #
          # It used to require post.version > pre.version for every owed
          # function, and that rule was wrong in both directions.
          #
          # It was wrong about deduplication. `supabase functions deploy`
          # skips an upload when its bundle already matches production, and
          # the platform ALSO deduplicates server-side -- run 36099775881 has
          # both on one page: fifteen functions printed "No change found",
          # and cartesia-access-token printed "Deploying Function (95 kB)",
          # printed "Deployed Functions", and stayed at v26 because the eszip
          # it uploaded was one production already had. All sixteen were
          # byte-perfect in production and all sixteen were called UNPROVEN.
          # Since the owed set is the diff from THIS ref, and this ref only
          # advances when every owed function proves, one partial deploy
          # deadlocked it permanently: refs/deployed/edge sat at 61cd6388 for
          # five days while production had long since converged.
          #
          # And it was wrong about increments. A version that moves says an
          # upload happened, not that the upload carried this revision -- so
          # a deploy of the wrong tree would have passed the old check.
          #
          # The earlier note here said the deployed original TypeScript was
          # unobtainable, having ruled out `functions download` (rewrites the
          # tree), /body (an eszip) and this endpoint ("metadata only ... No
          # files[]").
          #
          # A previous version of THIS comment said that last one had stopped
          # being true. It had not. Run 36104657682 asked production for all
          # eighteen owed functions and every one came back with no files at
          # all -- `files: 0/N`, artifact UNAVAILABLE, nothing proven, ref
          # untouched. The claim came from a Supabase MCP response, which does
          # return the deployed source for the whole closure but reaches it by
          # a route CI does not have. Measured:
          #
          #   GET .../functions/<slug>                      no files[]
          #   GET .../functions/<slug>?include_files=true   no files[]
          #   GET .../functions/<slug>/body                 the eszip, which
          #       would need a parser this repository does not carry
          #
          # ezbr_sha256 cannot stand in for them either, and it is worth
          # writing down why, because the field name invites the assumption.
          # Read out of CLI 2.117.0: the bundler writes output.eszip, the CLI
          # brotli-compresses it at quality 6, prefixes a constant, takes the
          # SHA-256 of that, and sends it as the ezbr_sha256 QUERY PARAMETER
          # of the upload. So the platform stores a number the CLI computed,
          # and "No change found in Function: x" is precisely that number
          # matching the one production already holds.
          #
          # It is not reproducible. Production disagreed with itself over a
          # byte-identical source closure: cartesia-access-token v26
          # a34394a5... and v27 43428031..., the same four files, each
          # verified identical to its revision, nothing in between touching
          # supabase/ or src/. Seventeen other functions hashed stably across
          # the same two runs, so the bundle is MOSTLY deterministic -- which
          # is exactly what a proof is not allowed to be.
          #
          # So the question below is still the one that was always meant:
          #
          #   PRODUCTION CONTAINS THE EXPECTED ARTIFACT FOR EVERY OWED
          #   FUNCTION.
          #
          # ...and today it cannot be answered, so it answers UNAVAILABLE and
          # this step fails. That is the correct failure. The ref does not
          # move on an unprovable claim, which is the whole reason this
          # mechanism exists.
          #
          # The old lesson still stands and is now enforced rather than
          # asked for: the CLI's "No change found", its "Deployed Functions",
          # its exit code, a version that moved and a version that did not are
          # ALL just deployment evidence. They are printed. They decide
          # nothing. If the API will not hand over the files, the function is
          # UNAVAILABLE and therefore unproven -- never quietly downgraded to
          # the weaker check this replaced.
          # ─────────────────────────────────────────────────────────────────
          node scripts/edgeArtifacts.mjs snapshot $(cat "$RUNNER_TEMP/owed.txt") > "$RUNNER_TEMP/post.json"
          node scripts/edgeArtifacts.mjs verify "$RUNNER_TEMP/pre.json" "$RUNNER_TEMP/post.json" \
            --since "$(cat "$RUNNER_TEMP/started-at-ms")"

      # ── E. The ref advances here, downstream of the proof, or not at all ─
      #
      # It used to advance in a separate terminal job reading
      # needs.deploy-functions.result. A result is a job's opinion of itself.
      # This step runs only when the step above proved the artifact changed,
      # in the same job, with no boundary in between, so `success()` carries
      # the whole guard: a failed verification, a stale artifact or an
      # unproven upload all leave the ref where it is and the work owed.
      #
      # NO_WORK does not advance it either. That costs one redundant scope
      # calculation on the next push; advancing it wrongly costs the work.
      - name: Advance refs/deployed/edge
        if: success() && github.event_name == 'push' && steps.owed.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git update-ref refs/deployed/edge '${{ github.sha }}'
          git push origin refs/deployed/edge --force
          echo "refs/deployed/edge -> ${GITHUB_SHA:0:8} (proven in production)"

  # ── Job 5: Deployment summary ─────────────────────────────────────────────
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate, build-frontend, migrate, deploy-functions]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## Homatch Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Frontend | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DB Migrations | ${{ needs.migrate.result }} (skipped unless run_migrations) |" >> $GITHUB_STEP_SUMMARY
          echo "| Edge Functions | ${{ needs.deploy-functions.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Supabase project:** \`ptxajsjhobhvsfhmutjn\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.validate.result }}"          == "failure" ]] || \
             [[ "${{ needs.build-frontend.result }}"    == "failure" ]] || \
             [[ "${{ needs.migrate.result }}"           == "failure" ]] || \
             [[ "${{ needs.deploy-functions.result }}"  == "failure" ]]; then
            echo "::error::One or more deployment steps failed — see above"
            exit 1
          fi

  # ── Job 5: Record what production is actually running ──────────────────────
  #
  # THIS IS THE SAFETY NET, AND IT IS DELIBERATELY LAST.
  #
  # refs/deployed/<component> is the base every future scope calculation is
  # measured from, so it advances only when that component's deploy SUCCEEDED.
  # A cancelled run, a failed upload or a job that never started all leave the
  # ref where it was, which leaves the work owed to the next run. That is the
  # whole mechanism by which a fix cannot be lost between two pushes.
  #
  # Written with the workflow token to a ref under refs/deployed/, which is not
  # a branch and cannot be checked out by accident.
  record-deployment:
    name: Record deployed revisions
    runs-on: ubuntu-latest
    needs: [scope, validate, build-frontend]
    # Only when the gate itself passed. On the first run of this job a failing
    # type-check skipped the edge deploy, and "skipped" was read as "nothing
    # was owed" -- so the ref advanced and the manifest claimed production was
    # current when the deploy had never run. That is the precise failure this
    # whole mechanism exists to prevent, committed by the mechanism itself.
    if: always() && github.event_name == 'push' && needs.validate.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Advance the frontend ref
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHA='${{ github.sha }}'

          advance() {
            local component="$1" outcome="$2"
            if [[ "$outcome" != "success" ]]; then
              echo "· $component: $outcome — ref stays put, the work stays owed"
              return
            fi
            git update-ref "refs/deployed/$component" "$SHA"
            git push origin "refs/deployed/$component" --force
            echo "✅ $component now at ${SHA:0:8}"
          }

          # EDGE IS NOT DECIDED HERE ANY MORE.
          #
          # This job used to advance refs/deployed/edge from
          # needs.deploy-functions.result plus needs.scope.outputs.edge, and
          # that arrangement produced two false refs in one afternoon: once
          # because a green job had uploaded nothing, and once because the job
          # was skipped and "skipped" was read here as "nothing was owed".
          #
          # Both readings were guesses about another job made across a
          # boundary. The deploy job now advances that ref itself, in the step
          # immediately after the one that proves the artifact moved, so there
          # is no gap for a guess to live in. The frontend ref stays: Vercel
          # deploys it outside this workflow, so a successful build is the
          # only signal that exists.
          frontend_outcome='${{ needs.build-frontend.result }}'
          if [[ "$frontend_outcome" == "skipped" ]]; then
            if [[ '${{ needs.scope.outputs.frontend }}' == 'true' ]]; then
              frontend_outcome="skipped although it was owed"
            else
              frontend_outcome=success
            fi
          fi
          advance frontend "$frontend_outcome"

