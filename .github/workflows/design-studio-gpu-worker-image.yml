name: Design Studio GPU worker image

on:
  push:
    branches: [main]
    paths:
      - 'infra/design-studio-gpu-worker/**'
      - '.github/workflows/design-studio-gpu-worker-image.yml'
  workflow_dispatch:

concurrency:
  group: design-studio-gpu-worker-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: insportia/homatch-design-studio-gpu-worker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable worker image
        uses: docker/build-push-action@v6
        with:
          context: infra/design-studio-gpu-worker
          file: infra/design-studio-gpu-worker/Dockerfile
          push: true
          build-args: |
            HM_IMAGE_REVISION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/insportia/homatch
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=HOMATCH Design Studio Runpod Blender scene factory
          cache-from: type=gha
          cache-to: type=gha,mode=max
