# TEMPORARY (PR #233 release proof). Production E2E of Find Property on
# www.homatch.live from a GitHub runner with one owner-approved test account.
# Runs on push to this working branch only; never merged into main.
name: Find Property live E2E
on:
  push:
    branches: [claude/dreamy-johnson-a1kwjv]
    paths: ['scripts/e2e/**', '.github/workflows/find-property-live-e2e.yml']
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright
        run: |
          mkdir -p /tmp/e2e && cd /tmp/e2e && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Live E2E
        env:
          E2E_EMAIL: claude-e2e-findproperty-${{ github.run_number }}@homatch.live
          E2E_QUERY: I want to buy an apartment in Tbilisi, 50 to 120 m², budget $80,000 to $200,000.
        run: cp scripts/e2e/find-property-live.mjs /tmp/e2e/ && cd /tmp/e2e && node find-property-live.mjs
      - name: Portal live check (read-only public pages)
        if: false # already proven in run 9
        run: node scripts/portals/live-check.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-shots, path: /tmp/e2e/e2e-shots, retention-days: 3 }
