name: MyHome Crawlee transport
on:
  pull_request:
    paths:
      - 'official-worker/src/marketplace/myhome/**'
      - 'official-worker/src/marketplace/MyHomeRuntime.ts'
      - 'official-worker/test/myhome-crawlee-browser.mjs'
      - 'official-worker/package.json'
      - 'official-worker/npm-shrinkwrap.json'
      - '.github/workflows/myhome-crawlee.yml'
permissions:
  contents: read
jobs:
  browser:
    # Pinned like pr-check.yml's worker job (63fabec7): ubuntu-latest moved to
    # 26.04 (2026-10-22), where the worker's Playwright 1.55 cannot install
    # Chromium and the job dies before any test runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install worker packages
        working-directory: official-worker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile worker
        working-directory: official-worker
        run: npm run test:build
      - name: Install existing Chromium version
        working-directory: official-worker
        run: npx playwright install chromium --with-deps
      - name: Real Chromium against local source fixtures only
        working-directory: official-worker
        run: node --test test/myhome-crawlee-browser.mjs
