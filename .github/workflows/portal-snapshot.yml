# TEMPORARY (Find Property portal adapter research, PR #210). Read-only fetches of
# public portal pages from a GitHub runner; no secrets, read-only token. Removed
# before the PR leaves draft.
name: Portal snapshot
on:
  pull_request:
    paths: ['scripts/portals/**', '.github/workflows/portal-snapshot.yml']
permissions:
  contents: read
concurrency:
  group: portal-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Snapshot
        if: hashFiles('scripts/portals/targets.txt') != ''
        run: |
          if [ -s scripts/portals/targets.txt ]; then
            node scripts/portals/snapshot.mjs --urls "$(grep -v '^#' scripts/portals/targets.txt | tr '\n' ',' | sed 's/,$//')"
          else
            node scripts/portals/snapshot.mjs
          fi
      - name: Dump pages
        if: hashFiles('scripts/portals/dump-targets.txt') != ''
        run: node scripts/portals/dump.mjs
      - name: Live adapter check
        if: hashFiles('scripts/portals/live-check.mjs') != ''
        run: node scripts/portals/live-check.mjs
