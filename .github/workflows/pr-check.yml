name: PR Checks

# THE ONE VALIDATION — PLANNED BY COMPONENT, RUN ONCE, IN PARALLEL, RECORDED.
#
# HOMATCH Fast Release (docs/claude/RELEASE.md). The plan job maps the changed
# files to components and their dependency closure (scripts/release/:
# component table, import graph, edge closure, migration objects, translation
# keys) and plans one tier:
#
#   TARGETED        static + unit + the suites of the reached components
#   COMPONENT_FULL  the complete suite set of a component whose change is
#                   security-relevant (access-control SQL, auth paths, shared
#                   edge code, its own workflow)
#   REPO_FULL       everything: toolchain, app shell, release engine, global
#                   auth / RLS primitives, anything unplaceable
#
# Every planned browser suite is its own parallel job (a dynamic matrix,
# split by owner, not round-robin). "Validate PR" is the aggregate, keeps the
# required check name, and only when every planned suite passed uploads a
# record naming the exact git tree that was validated.
#
# After merge, deploy.yml proves the deployed tree is that tree and promotes it
# without re-running anything. Without that proof it CALLS THIS WORKFLOW
# (workflow_call) for the merged commit's own change — the same plan, the same
# parallel jobs — before anything deploys.

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      base:
        description: The commit the change is planned against (the deployed commit's parent).
        type: string
        required: true

# A newer push to the same PR supersedes the older run; nothing is deployed
# from here, so cancelling loses no work. A post-merge call is its own group.
concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      suites: ${{ steps.plan.outputs.suites }}
      components: ${{ steps.plan.outputs.components }}
      matrix: ${{ steps.plan.outputs.matrix }}
      has_browser: ${{ steps.plan.outputs.has_browser }}
      run_worker: ${{ steps.plan.outputs.run_worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Planned by this change's engine AND the base branch's engine; the
      # stricter wins, so an engine change cannot plan itself less work.
      - name: Plan suites from the changed paths
        id: plan
        env:
          RELEASE_BASE: ${{ inputs.base || format('origin/{0}', github.base_ref) }}
        run: node scripts/release/plan.mjs

  # Type-check, lint (tsgo, biome, ast-grep rules, Tailwind, i18n), edge
  # function syntax, migration history and the production build. Always run.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          # 24: the suites import .ts modules directly (native type stripping).
          node-version: 24
          cache: pnpm
      # The .rules checks are ast-grep scans. Without the binary every scan
      # fails to start and the lint script still exits 0.
      - name: Install ast-grep
        run: |
          npm install -g @ast-grep/cli
          ast-grep --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # tsconfig.check.json: `tsc --noEmit` on the root config compiles
      # nothing (it has "files": [] and references only).
      - name: Type-check
        run: pnpm exec tsc -p tsconfig.check.json --noEmit
      - name: Lint
        env:
          VITE_SUPABASE_URL: https://ptxajsjhobhvsfhmutjn.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run lint
      # Deno TypeScript with URL and jsr: imports: nothing else parses them.
      - name: Edge function syntax
        run: pnpm run check:edge
      - name: Migration history
        run: node scripts/migration-baseline.mjs
      - name: Build check
        env:
          VITE_SUPABASE_URL: https://ptxajsjhobhvsfhmutjn.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run build

  # The whole regression suite — every unit, matrix and security source test
  # (~45 s). Always run: it is the cheapest complete proof there is.
  unit:
    name: Unit and matrix tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test

  # One job per planned browser suite, all in parallel. Each builds its own
  # harness from .env.harness (a stub origin, not a credential; every request
  # is intercepted) — a browser suite never reads a dist/ it did not build.
  # CI=true makes a missing browser or driver a FAILURE, not a skip.
  browser:
    name: ${{ matrix.title }}
    needs: plan
    if: needs.plan.outputs.has_browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build harness
        run: pnpm run build:harness
      - name: Run suite ${{ matrix.id }}
        run: node scripts/release/run-suite.mjs ${{ matrix.id }}

  # The Railway worker's own tests, when the worker is in the plan.
  worker:
    name: Railway worker tests
    needs: plan
    if: needs.plan.outputs.run_worker == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install worker dependencies
        run: npm install --prefix official-worker --no-audit --no-fund
      - name: Worker tests
        run: npm --prefix official-worker test

  # The required check. Green only when the plan ran and every suite it
  # planned passed; a planned suite that was skipped, cancelled or failed is
  # red. Then — and only then — the validation record is uploaded.
  validate:
    name: Validate PR
    needs: [plan, static, unit, browser, worker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every planned suite passed
        env:
          PLAN: ${{ needs.plan.result }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          WORKER: ${{ needs.worker.result }}
          RUN_BROWSER: ${{ needs.plan.outputs.has_browser }}
          RUN_WORKER: ${{ needs.plan.outputs.run_worker }}
          TIER: ${{ needs.plan.outputs.tier }}
        run: |
          set -euo pipefail
          ok=1
          need() { # name result planned
            if [[ "$3" == "true" && "$2" != "success" ]]; then echo "::error::$1 was planned and is $2"; ok=0; fi
            if [[ "$3" != "true" && "$2" != "skipped" && "$2" != "success" ]]; then echo "::error::$1 is $2"; ok=0; fi
            echo "$1: $2 (planned: $3)"
          }
          [[ -n "$TIER" ]] || { echo "::error::the plan produced no tier"; ok=0; }
          need plan "$PLAN" true
          need static "$STATIC" true
          need unit "$UNIT" true
          need browser "$BROWSER" "$RUN_BROWSER"
          need worker "$WORKER" "$RUN_WORKER"
          [[ "$ok" == 1 ]] || exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record what was validated
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/release/record.mjs validation-record.json --tier '${{ needs.plan.outputs.tier }}' --suites '${{ needs.plan.outputs.suites }}' --components '${{ needs.plan.outputs.components }}'
      - uses: actions/upload-artifact@v4
        with:
          name: validation-record
          path: validation-record.json
          retention-days: 90
          if-no-files-found: error
