name: Publishing Engine Checks
on:
  push:
    branches: [feat/publishing-engine-production]
  pull_request:
    paths: ['src/publishingEngine/**', 'public/publishing-engine/**', 'publishing-extension/**', 'supabase/functions/publishing-engine/**', 'tests/publishingEngine/**', 'supabase/migrations/*publishing_engine*.sql']
permissions:
  contents: read
jobs:
  publishing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: migration-proof-only
          POSTGRES_DB: publishing_proof
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Prove publishing migration on isolated PostgreSQL 17
        env:
          PGPASSWORD: migration-proof-only
        run: |
          node scripts/publishing/apply-migration.mjs --print > .publishing-migration.sql
          psql -h localhost -U postgres -d publishing_proof -f tests/publishingEngine/migration-proof.sql
      - name: Prove V2 tenant isolation and concurrent billing on isolated PostgreSQL 17
        env:
          PGPASSWORD: migration-proof-only
          PUBLISHING_PROOF: isolated-postgres-17
        run: |
          psql -h localhost -U postgres -d publishing_proof -f tests/publishingEngine/v2-proof.sql
          node tests/publishingEngine/v2-concurrency.mjs
          node tests/publishingEngine/managed-concurrency.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsgo -p tsconfig.check.json
      - run: pnpm exec tsc --noEmit --strict --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler --allowImportingTsExtensions supabase/functions/publishing-engine/server/http.ts supabase/functions/publishing-engine/server/adapters.ts supabase/functions/publishing-engine/server/worker.ts supabase/functions/publishing-engine/server/handler.ts
      - run: node scripts/i18n-check.mjs && node scripts/i18n-keys-check.mjs && node scripts/i18n-audit.mjs
      - run: node scripts/publishing/managed-worker.mjs --diagnostics
      - run: node --test tests/publishingEngine/*.test.mjs
      - run: pnpm run build

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Managed HTTP runtime compatibility (Railway Node 22.18)
        run: node --test tests/publishingEngine/managed-server.test.mjs tests/publishingEngine/managed-handler.test.mjs
