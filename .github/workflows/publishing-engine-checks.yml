name: Publishing Engine Checks
on:
  push:
    branches: [feat/publishing-engine-production]
  pull_request:
    paths: ['src/publishingEngine/**', 'public/publishing-engine/**', 'publishing-extension/**', 'supabase/functions/publishing-engine/**', 'tests/publishingEngine/**']
permissions:
  contents: read
jobs:
  publishing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: migration-proof-only
          POSTGRES_DB: publishing_proof
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Prove publishing migration on isolated PostgreSQL 17
        env:
          PGPASSWORD: migration-proof-only
        run: |
          node scripts/publishing/apply-migration.mjs --print > .publishing-migration.sql
          psql -h localhost -U postgres -d publishing_proof -f tests/publishingEngine/migration-proof.sql
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsgo -p tsconfig.check.json
      - run: node --test tests/publishingEngine/*.test.mjs
      - run: pnpm run build
