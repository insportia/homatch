<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything on a notched iPhone; without it an installed app renders
         inside the safe area and the design never sees the inset. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D0D0D" />
    <!-- iOS reads none of the manifest; these are its equivalents. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Homatch" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // First-paint surface palette. useSurfaceTheme() sets this for real once
      // React mounts, but the browser paints <body> before the bundle has even
      // parsed — without this the two light screens flash the dark palette on
      // a cold load. Kept to a literal path list rather than anything clever:
      // if it ever disagrees with the routes, React corrects it on mount.
      (function () {
        // Light is now the palette for the whole customer product, so this
        // is unconditional rather than a two-path allowlist. It used to name
        // '/' and '/dashboard', which is why every other screen painted the
        // dark palette for a frame before React corrected it — and why the
        // 27 screens that never claimed the surface at all stayed dark.
        document.documentElement.setAttribute('data-surface', 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
