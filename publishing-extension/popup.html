<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body {
  width: 420px;
  margin: 0;
  padding: 18px;
  background: #101216;
  color: #f5f5f5;
  font: 13px Arial, sans-serif;
}
h2 { margin-top: 0; }
small { color: #aaa; }
textarea {
  width: 100%;
  height: 230px;
  box-sizing: border-box;
  background: #1d2128;
  color: white;
  border: 1px solid #454b55;
  border-radius: 8px;
  padding: 10px;
}
button {
  width: 100%;
  margin-top: 9px;
  padding: 11px;
  border: 0;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}
.primary { background: #e0b66b; color: #111; }
.secondary { background: #303741; color: white; }
pre {
  white-space: pre-wrap;
  max-height: 230px;
  overflow: auto;
  background: #1d2128;
  padding: 10px;
  border-radius: 8px;
}
</style>
</head>
<body>
<h2>HOMATCH Publishing</h2>
<small>Universal multi-portal engine</small>
<p><a href="http://127.0.0.1:4177/" target="_blank" rel="noopener noreferrer">Open HOMATCH Property Workspace</a></p>
<p>Listing JSON</p>
<textarea id="data"></textarea>
<button class="secondary" id="inspect">Inspect Current Page</button>
<button class="secondary" id="copy">Copy Inspection JSON</button>
<button class="primary" id="fill">Fill Confirmed Fields</button>
<button class="secondary" id="save">Save Listing Locally</button>
<pre id="result">Ready</pre>
<script src="popup.js"></script>
</body>
</html>
