<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0C1119" />
    <!-- A shared home is private to the people it was sent to: never indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>A home to walk through · HOMATCH</title>
    <meta name="description" content="Walk through this home, designed in HOMATCH Design Studio." />
    <!-- Link previews in messaging apps. Deliberately generic: nothing about the
         home, its owner or its address is in the page before the token is read. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HOMATCH" />
    <meta property="og:title" content="A home to walk through" />
    <meta property="og:description" content="Walk through this home, designed in HOMATCH Design Studio." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <style>html, body { background: #0C1119; margin: 0; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/share/main.tsx"></script>
  </body>
</html>
